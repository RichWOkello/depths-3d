name: Verify Depths 3D v6.0.0
on:
  push:
  pull_request:
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --quiet nbformat pillow
      - run: node --check src/game.js
      - run: python build.py
      - run: node --check src/game.js
      - run: python -m py_compile build_bestiary.py
      - run: python -c "import nbformat; nbformat.validate(nbformat.read('depths_3d.ipynb', as_version=4))"
