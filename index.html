<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depths 3D — a first-person dungeon shooter</title>
<style>
  body { margin:0; min-height:100vh; background:#0b0b12; color:#dcdce8; font-family:Segoe UI,Arial,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { opacity:.65; font-size:13px; margin-bottom:12px; }
  .game { box-shadow:0 8px 40px #000a; border-radius:8px; overflow:hidden; }
  footer { margin-top:14px; font-size:12px; opacity:.55; text-align:center; line-height:1.6; }
  a { color:#8ab4ff; }
</style>
</head>
<body>
<h1>🏰 Depths 3D <span style="font-size:13px;opacity:.6">v1.1.0</span></h1>
<div class="sub">W A S D move · ← → turn · Space/F/click fire · right-drag look · P pause</div>
<div class="game">
<div id="dd3d-root" tabindex="0" style="position:relative;width:800px;max-width:100%;height:500px;background:#000;overflow:hidden;outline:none;font-family:Segoe UI,Arial,sans-serif;color:#fff;user-select:none">
<div class="hud" style="position:absolute;left:10px;top:8px;font-size:14px;text-shadow:0 1px 3px #000;line-height:1.5;pointer-events:none"></div>
<canvas class="mm" width="130" height="130" style="position:absolute;right:8px;top:8px;border:1px solid #556;background:rgba(0,0,0,.55);border-radius:6px;pointer-events:none"></canvas>
<div style="position:absolute;left:10px;bottom:12px;width:220px;height:12px;background:#222;border:1px solid #555;border-radius:6px;overflow:hidden;pointer-events:none"><div class="hpb" style="height:100%;width:100%;background:#3ddc84"></div></div>
<div style="position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;pointer-events:none"><div style="position:absolute;left:7px;top:0;width:2px;height:16px;background:rgba(255,255,255,.55)"></div><div style="position:absolute;left:0;top:7px;width:16px;height:2px;background:rgba(255,255,255,.55)"></div></div>
<div class="flash" style="position:absolute;left:0;top:0;right:0;bottom:0;background:#f00;opacity:0;pointer-events:none"></div>
<div class="toast" style="position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:15px;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .3s;pointer-events:none"></div>
<div class="ov" style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(5,5,12,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer"></div>
</div>
</div>
<footer>Created by Richard Okello · <a href="https://github.com/RichWOkello/depths-3d">GitHub</a> · MIT License</footer>
<script src="src/game.js"></script>
</body>
</html>
