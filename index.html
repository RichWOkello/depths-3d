<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Depths 3D is a first-person gothic dungeon shooter playable on the web and in Google Colab.">
<title>Depths 3D v5.0.0 — The Abyssal Expansion</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#0b0d16; color:#dce2f0; font-family:system-ui,Segoe UI,Arial,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:13px; }
  header { text-align:center; padding:2px 0 8px; }
  h1 { margin:0; font-size:22px; color:#ffe1ac; letter-spacing:1px; }
  .sub { font-size:12px; opacity:.75; margin:5px 0; }
  .game { width:100%; max-width:800px; margin:auto; border:1px solid #474250; box-shadow:0 10px 35px #0009; border-radius:9px; overflow:hidden; }
  #dd3d-root { width:100% !important; max-width:none !important; }
  .help { text-align:center; font-size:12px; line-height:1.65; margin:8px auto; color:#b4bdce; }
  .help b { color:#e4edfd; }
  footer { opacity:.7; text-align:center; font-size:11px; padding:4px; }
</style>
</head>
<body>
<main>
<header><h1>🏰 DEPTHS 3D <small style="font-size:12px;opacity:.6">v5.0.0</small></h1>
<div class="sub">The Abyssal Expansion · A cinematic dungeon shooter</div></header>
<div class="game"><div id="dd3d-root" tabindex="0" style="position:relative;width:800px;max-width:100%;aspect-ratio:8/5;background:#000;overflow:hidden;outline:none;font-family:Segoe UI,Arial,sans-serif;color:#fff;user-select:none">
<div class="hud" style="position:absolute;left:10px;top:8px;font-size:14px;text-shadow:0 1px 3px #000;line-height:1.5;pointer-events:none"></div>
<canvas class="mm" width="130" height="130" style="position:absolute;right:8px;top:8px;border:1px solid #556;background:rgba(0,0,0,.55);border-radius:6px;pointer-events:none"></canvas>
<div style="position:absolute;left:10px;bottom:12px;width:220px;height:12px;background:#222;border:1px solid #555;border-radius:6px;overflow:hidden;pointer-events:none"><div class="hpb" style="height:100%;width:100%;background:#3ddc84"></div></div>
<div style="position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;pointer-events:none"><div style="position:absolute;left:7px;top:0;width:2px;height:16px;background:rgba(255,255,255,.55)"></div><div style="position:absolute;left:0;top:7px;width:16px;height:2px;background:rgba(255,255,255,.55)"></div></div>
<div class="flash" style="position:absolute;left:0;top:0;right:0;bottom:0;background:#f00;opacity:0;pointer-events:none"></div>
<div class="toast" style="position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:15px;text-shadow:0 1px 4px #000;opacity:0;transition:opacity .3s;pointer-events:none"></div>
<div class="ov" style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(5,5,12,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer"></div>
</div></div>
<div class="help"><b>Begin from the title screen; adjust your loadout and preferences in the menu.</b> WASD move · Space/F fire · 1–8 weapons · Esc pause · Complete controls under Settings</div>
<footer>Created by Richard Okello · MIT License</footer>
</main>
<script src="src/game.js"></script>
</body>
</html>
